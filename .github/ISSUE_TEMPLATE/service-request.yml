name: Fixed-scope service request
description: Propose one public or safely redacted reproduction evidence pilot.
title: "[scope] "
labels: ["service-intake"]
body:
  - type: markdown
    attributes:
      value: |
        Public intake only. Do not include credentials, tokens, private keys, seed phrases, recovery material, personal data, confidential logs, private incident details, or production access.

        Payment is available only after Bemjamin confirms the exact scope and price in writing. Settlement is Solana network only in issuer-native USDC or USDT—no bridged or wrapped variants. The public receive address is `6EGnm1Gw1KTKVPVvTkyazyTAboKDMaVMx7bG1kLMULq5` ([Solana Explorer](https://explorer.solana.com/address/6EGnm1Gw1KTKVPVvTkyazyTAboKDMaVMx7bG1kLMULq5)). Never send merely because this issue is open; first-time senders should make a small test transfer. Wrong-network or unsupported-token transfers may be unrecoverable, and payment does not expand the agreed scope.
  - type: input
    id: requester
    attributes:
      label: Requester and authority
      description: Who is requesting this, and what authorizes testing or modification of the named artifact?
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Public or safely redacted artifact
      description: Link one repository, issue, fixture, or public deployment.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Current offer:** USD 25 introductory reproduction evidence pilot. One failure, one public or synthetic workflow, one primary question, one runnable acceptance command, and delivery within 3 UTC days after written scope acceptance. This rate is not yet market-validated.
  - type: textarea
    id: question
    attributes:
      label: One bounded question
      description: State the single decision or behavior to establish.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include minimal reproducible inputs when public and safe.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runtime, versions, operating system, and relevant constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance check
      description: What exact command or observable result would make the delivery complete?
    validations:
      required: true
  - type: input
    id: timing
    attributes:
      label: Timing constraint
      description: Desired date or "none"; catalog ranges are estimates, not SLAs.
    validations:
      required: true
  - type: dropdown
    id: settlement_asset
    attributes:
      label: Settlement preference if scope is accepted
      description: This is not a payment request; scope and price must be confirmed in writing first.
      options:
        - Issuer-native USDC on Solana
        - Issuer-native USDT on Solana
        - Not decided
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data declaration
      options:
        - label: I confirm this issue contains no secrets, credentials, private keys, seed phrases, recovery material, private incident data, personal data, or unauthorized targets.
          required: true
        - label: I understand that opening an issue does not create an engagement and I will not send funds before written scope and price confirmation.
          required: true
        - label: If payment is agreed, I will use only issuer-native USDC or USDT on Solana, make a small first-time test transfer, and understand that wrong-network or unsupported-token transfers may be unrecoverable.
          required: true
        - label: I understand that payment does not expand the agreed scope.
          required: true
